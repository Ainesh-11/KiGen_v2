
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kigen"
version = "0.1.0"
description = "Programmatic KiCad 9 schematic generation framework"
requires-python = ">=3.12"
dependencies = [
    "lark",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
